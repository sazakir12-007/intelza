name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The Gradle build downloads the SDK platform itself; the native toolchain is
      # installed up front so failures are easier to spot.
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelza-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
